<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte Musculaire Interactive</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161922;
    --border: #252a35;
    --text: #e8eaf0;
    --muted: #6b7385;
    --accent: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    padding: 28px 40px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 16px;
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.6rem;
    letter-spacing: 3px;
    color: #fff;
  }

  header span {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: calc(100vh - 80px);
  }

  /* SIDEBAR */
  .sidebar {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 24px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .sidebar-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 3px;
    color: var(--muted);
    padding: 0 24px 16px;
    text-transform: uppercase;
  }

  .muscle-item {
    padding: 12px 24px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.18s ease;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .muscle-item:hover {
    background: rgba(255,255,255,0.04);
  }

  .muscle-item.active {
    background: rgba(255,255,255,0.06);
  }

  .color-dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .muscle-name {
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--text);
    flex: 1;
  }

  .muscle-side {
    font-size: 0.68rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .chevron {
    color: var(--muted);
    font-size: 0.7rem;
    transition: transform 0.2s;
  }

  .muscle-item.active .chevron { transform: rotate(90deg); }

  /* MAIN PANEL */
  .main {
    display: grid;
    grid-template-rows: 1fr 280px;
  }

  .figure-area {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    position: relative;
    gap: 80px;
  }

  .figure-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .figure-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 3px;
    color: var(--muted);
  }

  .body-svg {
    width: 200px;
    height: auto;
    filter: drop-shadow(0 8px 32px rgba(0,0,0,0.6));
  }

  .body-svg .muscle-region {
    cursor: pointer;
    transition: opacity 0.2s, filter 0.2s;
  }

  .body-svg .muscle-region:hover {
    opacity: 0.85;
    filter: brightness(1.15);
  }

  .body-svg .muscle-region.highlighted {
    filter: brightness(1.3) drop-shadow(0 0 6px currentColor);
    stroke: #fff;
    stroke-width: 1.5px;
  }

  .body-svg .muscle-region.dimmed {
    opacity: 0.2;
  }

  /* DETAIL PANEL */
  .detail-panel {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 28px 40px;
    overflow-y: auto;
  }

  .detail-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 1px;
  }

  .detail-content { display: none; }
  .detail-content.visible { display: block; }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }

  .detail-color {
    width: 18px;
    height: 18px;
    border-radius: 4px;
  }

  .detail-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 2px;
    color: #fff;
  }

  .detail-side-badge {
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: var(--border);
    padding: 3px 10px;
    border-radius: 20px;
    color: var(--muted);
  }

  .subcategories {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .subcat-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.82rem;
    color: var(--text);
    border-left-width: 3px;
    transition: background 0.15s;
  }

  .subcat-card:hover { background: rgba(255,255,255,0.03); }

  .subcat-name { font-weight: 500; }
  .subcat-detail { color: var(--muted); font-size: 0.74rem; margin-top: 2px; }
</style>
</head>
<body>

<script>
const muscles = [
  {
    id: "pectoraux",
    name: "Pectoraux",
    color: "#5bc8d4",
    side: "Antérieur",
    subs: [
      { name: "Grand pectoral — chef claviculaire", detail: "Partie supérieure, mobilise l'épaule vers l'avant" },
      { name: "Grand pectoral — chef sternal", detail: "Partie centrale, adduction horizontale" },
      { name: "Grand pectoral — chef abdominal", detail: "Partie inférieure, rotation interne" },
      { name: "Petit pectoral", detail: "Profond, stabilise l'omoplate" },
    ]
  },
  {
    id: "deltoides",
    name: "Deltoïdes",
    color: "#e8883a",
    side: "Antérieur / Postérieur",
    subs: [
      { name: "Faisceau antérieur", detail: "Flexion et rotation interne du bras" },
      { name: "Faisceau moyen", detail: "Abduction du bras, portion latérale" },
      { name: "Faisceau postérieur", detail: "Extension et rotation externe du bras" },
    ]
  },
  {
    id: "biceps",
    name: "Biceps brachial",
    color: "#4a9e5c",
    side: "Antérieur",
    subs: [
      { name: "Chef long (longue portion)", detail: "Origine sur le tubercule supra-glénoïdal" },
      { name: "Chef court (courte portion)", detail: "Origine sur le processus coracoïde" },
      { name: "Brachial antérieur", detail: "Synergiste profond, fléchisseur pur du coude" },
    ]
  },
  {
    id: "avantbras",
    name: "Avant-bras",
    color: "#8dc63f",
    side: "Antérieur / Postérieur",
    subs: [
      { name: "Fléchisseur radial du carpe", detail: "Flexion et abduction du poignet" },
      { name: "Fléchisseur ulnaire du carpe", detail: "Flexion et adduction du poignet" },
      { name: "Fléchisseurs des doigts", detail: "Fléchisseur superficiel + profond" },
      { name: "Rond pronateur", detail: "Prono-flexion de l'avant-bras" },
      { name: "Extenseurs du carpe", detail: "Extension dorsale du poignet" },
      { name: "Supinateur", detail: "Supination de l'avant-bras" },
    ]
  },
  {
    id: "abdominaux",
    name: "Abdominaux",
    color: "#c0392b",
    side: "Antérieur",
    subs: [
      { name: "Grand droit de l'abdomen", detail: "Flexion du tronc, les 'tablettes'" },
      { name: "Oblique externe", detail: "Rotation et flexion latérale du tronc" },
      { name: "Oblique interne", detail: "Rotation controlatérale, complémentaire" },
      { name: "Transverse de l'abdomen", detail: "Gainant profond, stabilité lombaire" },
    ]
  },
  {
    id: "obliques",
    name: "Obliques / Flancs",
    color: "#8e44ad",
    side: "Antérieur",
    subs: [
      { name: "Oblique externe", detail: "Couche superficielle, rotation ipsilatérale" },
      { name: "Oblique interne", detail: "Couche intermédiaire, rotation contralatérale" },
      { name: "Carré des lombes", detail: "Profond, élévation du bassin, stabilité lombaire" },
    ]
  },
  {
    id: "quadriceps",
    name: "Quadriceps",
    color: "#f1c40f",
    side: "Antérieur",
    subs: [
      { name: "Droit fémoral", detail: "Bi-articulaire : flexion hanche + extension genou" },
      { name: "Vaste latéral", detail: "Chef externe, extension du genou" },
      { name: "Vaste médial", detail: "Chef interne, stabilise la rotule" },
      { name: "Vaste intermédiaire", detail: "Chef central profond, extension du genou" },
    ]
  },
  {
    id: "tibial",
    name: "Tibial antérieur",
    color: "#1abc9c",
    side: "Antérieur",
    subs: [
      { name: "Tibial antérieur", detail: "Dorsiflexion et inversion du pied" },
      { name: "Long extenseur des orteils", detail: "Extension des 4 orteils latéraux" },
      { name: "Long extenseur de l'hallux", detail: "Extension du gros orteil" },
      { name: "Long fibulaire", detail: "Éversion et plantarflexion" },
    ]
  },
  {
    id: "trapezes",
    name: "Trapèzes",
    color: "#e84c3d",
    side: "Postérieur",
    subs: [

      { name: "Trapèze moyen", detail: "Rétraction scapulaire, posture" },
      { name: "Trapèze inférieur", detail: "Abaissement et rotation externe de l'omoplate" },
    ]
  },
  {
    id: "granddorsal",
    name: "Grand dorsal",
    color: "#8B6347",
    side: "Postérieur",
    subs: [
      { name: "Portion iliaque", detail: "Origine sur la crête iliaque" },
      { name: "Portion costale", detail: "Origine sur les 3-4 dernières côtes" },
      { name: "Portion scapulaire", detail: "Origine sur l'angle inférieur de l'omoplate" },
      { name: "Sous-épineux", detail: "Rotation externe de l'humérus (coiffe)" },
      { name: "Petit rond", detail: "Rotation externe, stabilité gléno-humérale" },
    ]
  },
  {
    id: "triceps",
    name: "Triceps brachial",
    color: "#16a085",
    side: "Postérieur",
    subs: [
      { name: "Chef long", detail: "Extension du coude + adduction du bras" },
      { name: "Chef latéral", detail: "Extension puissante du coude" },

    ]
  },
  {
    id: "erecteurs",
    name: "Érecteurs du rachis",
    color: "#6B4423",
    side: "Postérieur",
    subs: [

      { name: "Longissimus", detail: "Portion centrale, extenseur principal du rachis" },

  },

    side: "Postérieur",
    subs: [

      { name: "Moyen fessier", detail: "Abduction de la hanche, stabilité du bassin" },
      { name: "Petit fessier", detail: "Abduction fine, rotation interne de la hanche" },
      { name: "Piriforme", detail: "Rotation externe, stabilité sacro-iliaque" },
    ]
  },
  {
    id: "ischiojambiers",
    name: "Ischio-jambiers",
    color: "#d4a017",
    side: "Postérieur",
    subs: [
      { name: "Biceps fémoral — chef long", detail: "Bi-articulaire : extension hanche + flexion genou" },
      { name: "Biceps fémoral — chef court", detail: "Flexion du genou uniquement" },
      { name: "Semi-tendineux", detail: "Extension hanche + rotation interne du tibia" },
      { name: "Semi-membraneux", detail: "Extension hanche + flexion genou, médial" },
    ]
  },
  {
    id: "mollets",
    name: "Mollets",
    color: "#922b21",
    side: "Postérieur",
    subs: [
      { name: "Gastrocnémien médial", detail: "Chef interne, plantarflexion puissante" },
      { name: "Gastrocnémien latéral", detail: "Chef externe, plantarflexion" },
      { name: "Soléaire", detail: "Profond, actif même genou fléchi, endurance" },
      { name: "Plantaire", detail: "Vestigial, plantarflexion faible" },
      { name: "Poplité", detail: "Déverrouillage du genou en flexion initiale" },
    ]
  },
];

// Build sidebar
const list = document.getElementById('muscle-list');
muscles.forEach(m => {
  const el = document.createElement('div');
  el.className = 'muscle-item';
  el.dataset.id = m.id;
  el.innerHTML = `
    <div class="color-dot" style="background:${m.color}"></div>
    <span class="muscle-name">${m.name}</span>
    <span class="muscle-side">${m.side.includes('/') ? 'A+P' : m.side === 'Antérieur' ? 'ANT' : 'POST'}</span>
    <span class="chevron">▶</span>
  `;
  el.addEventListener('click', () => selectMuscle(m.id));
  list.appendChild(el);
});

function selectMuscle(id) {
  const m = muscles.find(x => x.id === id);
  if (!m) return;

  // Sidebar active
  document.querySelectorAll('.muscle-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
    el.style.borderLeftColor = el.dataset.id === id ? m.color : 'transparent';
  });

  // SVG highlight
  document.querySelectorAll('.muscle-region').forEach(el => {
    if (el.dataset.id === id) {
      el.classList.add('highlighted');
      el.classList.remove('dimmed');
    } else {
      el.classList.remove('highlighted');
      el.classList.add('dimmed');
    }
  });

  // Detail panel
  document.getElementById('detail-empty').style.display = 'none';
  const dc = document.getElementById('detail-content');
  dc.classList.add('visible');
  document.getElementById('detail-color').style.background = m.color;
  document.getElementById('detail-title').textContent = m.name;
  document.getElementById('detail-side').textContent = m.side;

  const subs = document.getElementById('subcategories');
  subs.innerHTML = m.subs.map(s => `
    <div class="subcat-card" style="border-left-color:${m.color}">
      <div class="subcat-name">${s.name}</div>
      <div class="subcat-detail">${s.detail}</div>
    </div>
  `).join('');
}

// SVG click
document.querySelectorAll('.muscle-region').forEach(el => {
  el.addEventListener('click', () => selectMuscle(el.dataset.id));
});
</script>
</body>
</html>
